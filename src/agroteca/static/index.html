<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f3eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121a1f" media="(prefers-color-scheme: dark)">
<title>Agroteca — asistente agronómico</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌱%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Light — "Forest" (hex fallback first, then OKLCH for modern browsers) */
    --bg-0: #f6f3eb; --bg-0: oklch(97% 0.012 95);
    --bg-1: #fdfcf7; --bg-1: oklch(99% 0.008 95);
    --bg-2: #eae4d4; --bg-2: oklch(93% 0.018 95);
    --border: #d5cfbd; --border: oklch(85% 0.02 100);
    --text: #2a3226; --text: oklch(24% 0.03 140);
    --text-dim: #5b6551; --text-dim: oklch(45% 0.03 130);
    --accent: #2c7a48; --accent: oklch(45% 0.13 150);
    --accent-2: #8a6338; --accent-2: oklch(48% 0.09 50);
    --shadow: 0 14px 40px rgba(52, 42, 20, 0.10); --glow: rgba(44,122,72,.15);
    --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    /* legacy names aliased onto the premium palette — keeps every existing selector working */
    --bg: var(--bg-0); --card: var(--bg-1); --field: var(--bg-1); --chip-bg: var(--bg-2);
    --ink: var(--text); --muted: var(--text-dim);
    --line: var(--border); --chip-border: var(--border); --toggle-border: var(--border);
    --green: var(--accent); --green-deep: var(--text);
  }
  :root[data-theme="dark"] {
    /* Dark — "Clair de Lune" (moonlit, cool) */
    --bg-0: #121a1f; --bg-0: oklch(16% 0.025 210);
    --bg-1: #18222a; --bg-1: oklch(20% 0.03 205);
    --bg-2: #212d35; --bg-2: oklch(25% 0.03 205);
    --border: #37444c; --border: oklch(34% 0.03 200);
    --text: #e5eaed; --text: oklch(93% 0.012 200);
    --text-dim: #a1abb0; --text-dim: oklch(70% 0.02 195);
    --accent: #c3cfe9; --accent: oklch(88% 0.05 235);
    --accent-2: #82c398; --accent-2: oklch(72% 0.1 150);
    --shadow: 0 16px 44px rgba(0, 0, 0, 0.5); --glow: rgba(130,195,152,.20);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-0: #121a1f; --bg-0: oklch(16% 0.025 210);
      --bg-1: #18222a; --bg-1: oklch(20% 0.03 205);
      --bg-2: #212d35; --bg-2: oklch(25% 0.03 205);
      --border: #37444c; --border: oklch(34% 0.03 200);
      --text: #e5eaed; --text: oklch(93% 0.012 200);
      --text-dim: #a1abb0; --text-dim: oklch(70% 0.02 195);
      --accent: #c3cfe9; --accent: oklch(88% 0.05 235);
      --accent-2: #82c398; --accent-2: oklch(72% 0.1 150);
      --shadow: 0 16px 44px rgba(0, 0, 0, 0.5); --glow: rgba(130,195,152,.20);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: 'Manrope', -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink);
    background: var(--bg);
    min-height: 100vh; line-height: 1.6; -webkit-font-smoothing: antialiased; transition: background-color .3s, color .3s;
  }
  body::before {
    content: ""; position: fixed; inset: -15%; z-index: -1; pointer-events: none;
    background:
      radial-gradient(38% 44% at 24% 18%, var(--bg-2) 0%, transparent 68%),
      radial-gradient(42% 40% at 80% 26%, var(--bg-2) 0%, transparent 70%);
    opacity: .6; filter: blur(30px);
    animation: breathe 16s ease-in-out infinite;
  }
  @keyframes breathe { 0%, 100% { transform: scale(1) translateY(0); opacity: .45; } 50% { transform: scale(1.07) translateY(-1.5%); opacity: .62; } }
  .wrap { max-width: 720px; margin: 0 auto; padding: 52px 20px 90px; }
  :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; border-radius: 8px; }

  .controls { position: fixed; top: 20px; right: 20px; z-index: 20; display: flex; align-items: center; gap: 10px; }
  .iconbtn { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--toggle-border); background: var(--card); color: var(--ink); font-size: 19px; cursor: pointer; box-shadow: var(--shadow); transition: transform .15s, border-color .15s; }
  .iconbtn:hover { transform: translateY(-1px) rotate(-8deg); border-color: var(--green); }
  .langtoggle { display: inline-flex; align-items: center; gap: 2px; background: var(--card); border: 2px solid var(--toggle-border); border-radius: 999px; padding: 6px; box-shadow: var(--shadow); }
  .langtoggle .leaf { font-size: 20px; padding: 0 4px 0 9px; }
  .langtoggle button { background: transparent; color: var(--muted); border: 0; border-radius: 999px; padding: 9px 16px; font-size: 15px; font-weight: 800; cursor: pointer; letter-spacing: .5px; transition: background .18s, color .18s; }
  .langtoggle button.active { background: var(--accent); color: var(--bg-0); box-shadow: 0 3px 10px var(--glow); }
  .langtoggle button:not(.active):hover { color: var(--green-deep); }

  header { text-align: center; margin-bottom: 32px; animation: rise .5s ease both; }
  .logo { font-size: 44px; line-height: 1; }
  h1 { font-family: 'Source Serif 4', Georgia, "Times New Roman", serif; font-weight: 600; font-size: 38px; margin: 8px 0 6px; color: var(--accent); letter-spacing: -0.5px; }
  .tag { color: var(--muted); font-size: 15px; margin: 0; text-wrap: pretty; }
  .tag em { color: var(--accent); font-style: italic; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 22px; animation: rise .5s ease .06s both; }
  textarea { width: 100%; border: 1px solid var(--line); border-radius: 13px; padding: 14px 16px; font-size: 16px; font-family: inherit; color: var(--ink); resize: none; overflow: hidden; min-height: 74px; background: var(--field); outline: none; transition: border-color .15s, box-shadow .15s; }
  textarea:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--glow); }
  .row { display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  button.ask { background: var(--accent); color: var(--bg-0); border: 0; border-radius: 10px; padding: 12px 24px; font-size: 15px; font-weight: 700; cursor: pointer; transition: filter .15s, transform .05s, box-shadow .15s; }
  button.ask:hover { filter: brightness(1.06); box-shadow: 0 6px 16px var(--glow); }
  button.ask:active { transform: translateY(1px); }
  button.ask:disabled { background: var(--muted); cursor: not-allowed; box-shadow: none; opacity: .65; }
  .surprise { background: var(--card); border: 1px solid var(--line); color: var(--ink); border-radius: 12px; padding: 11px 13px; font-size: 17px; cursor: pointer; transition: transform .2s, border-color .15s; }
  .surprise:hover { transform: rotate(18deg); border-color: var(--green); }
  .hint { color: var(--muted); font-size: 13px; }
  .counter { color: var(--muted); font-family: var(--mono); font-size: 12px; margin-left: auto; opacity: .7; font-variant-numeric: tabular-nums; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chip { font-size: 13px; color: var(--green-deep); background: var(--chip-bg); border: 1px solid var(--chip-border); border-radius: 999px; padding: 6px 13px; cursor: pointer; transition: transform .15s, background .15s, box-shadow .15s; }
  .chip:hover { transform: translateY(-2px); box-shadow: 0 4px 12px var(--glow); }

  .answer { margin-top: 22px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--green); border-radius: 13px; padding: 20px 22px; font-size: 16.5px; display: none; }
  .answer.show { display: block; animation: rise .35s ease both; }
  .answer-text { white-space: pre-wrap; word-wrap: break-word; text-wrap: pretty; }
  .cursor { display: inline-block; width: 8px; height: 1.05em; vertical-align: text-bottom; background: var(--accent); margin-left: 1px; animation: blink 1s steps(1) infinite; }
  .tok { animation: fadeIn .5s ease both; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .actionbar { display: flex; align-items: center; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .seal { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--accent-2); background: var(--chip-bg); border: 1px solid var(--chip-border); border-radius: 999px; padding: 5px 11px; }
  .modelbadge { font-family: var(--mono); font-size: 11.5px; color: var(--muted); letter-spacing: .3px; }
  .spacer { margin-left: auto; }
  .act { display: inline-flex; align-items: center; gap: 5px; background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 9px; padding: 6px 11px; font-size: 13px; cursor: pointer; transition: color .15s, border-color .15s, background .15s; font-family: inherit; }
  .act:hover { color: var(--green-deep); border-color: var(--green); }
  .act.on { color: var(--green); border-color: var(--green); background: var(--chip-bg); }

  .empty { text-align: center; padding: 12px 0 6px; }
  .empty-icon { font-size: 46px; }
  .empty-title { font-weight: 700; color: var(--green-deep); margin-top: 8px; }
  .empty-text { color: var(--muted); font-size: 14px; margin-top: 4px; max-width: 44ch; margin-left: auto; margin-right: auto; text-wrap: pretty; }

  .sources { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
  .sources > summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; user-select: none; }
  .sources > summary::-webkit-details-marker { display: none; }
  .sources > summary::before { content: '▸ '; }
  .sources[open] > summary::before { content: '▾ '; }
  .sources > summary:hover { color: var(--green-deep); }
  .latency { color: var(--muted); font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .lowconf { color: var(--accent); font-size: 12.5px; margin: 10px 0 2px; }
  .src { margin-top: 13px; }
  .src-head { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .src-name { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .src-score { margin-left: auto; color: var(--accent-2); font-family: var(--mono); font-size: 11.5px; }
  .scorebar { height: 4px; background: var(--chip-border); border-radius: 999px; margin: 5px 0 6px; overflow: hidden; }
  .scorebar > span { display: block; height: 100%; background: var(--accent-2); border-radius: 999px; }
  .src-snip { color: var(--muted); font-size: 12.5px; line-height: 1.5; text-wrap: pretty; }
  .tier { font: 600 9.5px var(--mono); letter-spacing: .6px; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; border: 1px solid transparent; flex: none; }
  .tier-open { color: var(--bg-0); background: var(--accent-2); }
  .tier-syn { color: var(--bg-0); background: var(--text-dim); }
  .tier-local { color: var(--text-dim); background: transparent; border-color: var(--border); }
  .tier-dist { color: var(--accent); background: transparent; border-color: var(--accent); }
  .tier-unk { color: var(--text-dim); background: transparent; border-color: var(--border); }
  .src-page { color: var(--muted); font-family: var(--mono); font-weight: 600; font-size: 11px; }

  .loading { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 0 8px; }
  .sprout { font-size: 48px; line-height: 1; display: inline-block; animation: sproutPop 1.1s ease-in-out infinite; }
  @keyframes sproutPop { 0% { transform: scale(.55) translateY(6px); opacity: .5; } 38% { transform: scale(1.2) translateY(-2px); } 100% { transform: scale(1) translateY(0); opacity: 1; } }
  .loading-text { color: var(--muted); font-style: italic; font-size: 14.5px; }
  .streamstats { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); margin-bottom: 10px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .stopbtn { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 5px 12px; font-size: 12.5px; cursor: pointer; font-family: inherit; transition: color .15s, border-color .15s; }
  .stopbtn:hover { color: var(--accent); border-color: var(--accent); }
  .streamstats .stopbtn { margin-left: auto; }
  .loading .stopbtn { margin-top: 2px; }
  .stopped { color: var(--muted); font-style: italic; font-size: 13.5px; margin-top: 10px; }

  footer { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 34px; }
  .statusstrip { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: #5a9a3a; } .dot.down { background: #c0563e; }

  /* history panel + help modal (Wave E) */
  .panel { position: fixed; top: 0; right: 0; height: 100%; width: 330px; max-width: 86vw; background: var(--card); border-left: 1px solid var(--line); box-shadow: var(--shadow); transform: translateX(100%); transition: transform .25s ease; z-index: 40; padding: 22px 20px; overflow-y: auto; }
  .panel.open { transform: translateX(0); }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .panel-head span { font-weight: 700; color: var(--green-deep); font-size: 16px; }
  .panel-x { background: transparent; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; line-height: 1; }
  .hist-item { display: block; width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line); color: var(--ink); padding: 11px 2px; font-size: 13.5px; cursor: pointer; font-family: inherit; }
  .hist-item:hover { color: var(--green-deep); }
  .hist-empty { color: var(--muted); font-style: italic; font-size: 13px; }
  .scrim { position: fixed; inset: 0; background: rgba(20,15,5,.35); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 30; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(20,15,5,.4); z-index: 50; }
  .modal.open { display: flex; }
  .modal-box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 22px; width: 340px; max-width: 90vw; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .modal-head span { font-weight: 700; color: var(--green-deep); }
  .kbd-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; font-size: 13.5px; color: var(--muted); }
  kbd { background: var(--chip-bg); border: 1px solid var(--chip-border); border-radius: 6px; padding: 2px 8px; font-family: var(--mono); font-size: 12px; color: var(--ink); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; } }
</style>
</head>
<body>
  <div class="controls">
    <button class="iconbtn" id="histBtn" aria-label="Historial / History" title="Historial">📜</button>
    <button class="iconbtn" id="themeBtn" aria-label="Cambiar tema / Toggle theme" title="Tema">☾</button>
    <div class="langtoggle" id="langtoggle" role="group" aria-label="Idioma / Language">
      <span class="leaf" aria-hidden="true">🌿</span>
      <button data-lang="es" aria-pressed="false">ES</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <div class="wrap">
    <header>
      <div class="logo" aria-hidden="true">🌱</div>
      <h1>Agroteca</h1>
      <p class="tag" id="tagline"></p>
    </header>

    <div class="card">
      <textarea id="q" rows="1" aria-label="Pregunta / Question"></textarea>
      <div class="row">
        <button class="ask" id="ask"></button>
        <button class="surprise" id="surprise" aria-label="Sorpréndeme / Surprise me" title="🎲">🎲</button>
        <span class="hint" id="hint"></span>
        <span class="counter" id="counter" aria-hidden="true"></span>
      </div>
      <div class="chips" id="chips"></div>
    </div>

    <div class="answer" id="answer" aria-live="polite" role="status"></div>

    <footer>
      <div id="footer"></div>
      <div class="statusstrip"><span class="dot" id="healthdot"></span><span id="statsRibbon"></span></div>
    </footer>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="panel" id="histPanel" aria-hidden="true">
    <div class="panel-head"><span id="histTitle"></span><button class="panel-x" id="histClose" aria-label="close">✕</button></div>
    <div id="histList"></div>
  </aside>
  <div class="modal" id="help" aria-hidden="true">
    <div class="modal-box">
      <div class="modal-head"><span id="helpTitle"></span><button class="panel-x" id="helpClose" aria-label="close">✕</button></div>
      <div id="kbds"></div>
    </div>
  </div>

<script>
  const I18N = {
    es: {
      tagline: 'Respuestas agronómicas <em>con cita</em> — o un honesto "no lo sé".',
      ask: 'Preguntar',
      hint: 'Ctrl+Enter enviar · / enfocar · ? atajos · ~1–2 min (CPU local)',
      loading: 'Consultando el corpus…',
      footer: 'Local · sin nube · fundado en un corpus curado y gobernado por licencia.',
      error: (m) => 'Error: ' + m + ' — ¿está corriendo el servidor (uvicorn)?',
      grounded: 'Fundado', copy: 'Copiar', copied: 'Copiado', exportLabel: 'Exportar', share: 'Enlace', shareCopied: 'Enlace copiado',
      abstainTitle: 'Fuera del corpus', abstainText: 'No está en las fuentes disponibles — y el sistema prefiere decirlo a inventarlo.',
      sourcesLabel: 'Fuentes recuperadas', lowConfidence: 'Coincidencia débil — lee con cautela.',
      stopLabel: 'Detener', stopped: 'Detenido',
      historyTitle: 'Historial', historyEmpty: 'Aún no hay preguntas.', helpTitle: 'Atajos de teclado',
      stats: ['fragmentos', 'documentos', 'niveles'],
      kbds: [['/', 'Enfocar la pregunta'], ['Ctrl/⌘ + Enter', 'Enviar'], ['Esc', 'Limpiar o cerrar'], ['?', 'Esta ayuda']],
      chips: [
        "¿Cuánta agua se puede captar por cada milímetro de lluvia sobre un metro cuadrado de techo?",
        "¿En qué año fue introducida Rodolia cardinalis a California?",
        "What stocking density does the FAO guide recommend for aquaponic fish?",
        "¿Cuál es el precio de exportación de la avellana chilena a China?"
      ]
    },
    en: {
      tagline: 'Agronomy answers <em>with citations</em> — or an honest "I don\'t know".',
      ask: 'Ask',
      hint: 'Ctrl+Enter send · / focus · ? shortcuts · ~1–2 min (local CPU)',
      loading: 'Searching the corpus…',
      footer: 'Local · no cloud · grounded in a curated, license-governed corpus.',
      error: (m) => 'Error: ' + m + ' — is the server (uvicorn) running?',
      grounded: 'Grounded', copy: 'Copy', copied: 'Copied', exportLabel: 'Export', share: 'Link', shareCopied: 'Link copied',
      abstainTitle: 'Outside the corpus', abstainText: 'It\'s not in the available sources — and the system would rather say so than invent it.',
      sourcesLabel: 'Retrieved sources', lowConfidence: 'Weak match — read with care.',
      stopLabel: 'Stop', stopped: 'Stopped',
      historyTitle: 'History', historyEmpty: 'No questions yet.', helpTitle: 'Keyboard shortcuts',
      stats: ['chunks', 'documents', 'tiers'],
      kbds: [['/', 'Focus the question'], ['Ctrl/⌘ + Enter', 'Send'], ['Esc', 'Clear or close'], ['?', 'This help']],
      chips: [
        "How much water can be harvested per millimetre of rain on a square metre of roof?",
        "In what year was Rodolia cardinalis introduced to California?",
        "¿Qué densidad de peces recomienda la guía FAO para un sistema acuapónico?",
        "What is the export price of Chilean hazelnuts to China?"
      ]
    }
  };

  const SURPRISE = [
    "¿Cuánta agua se puede captar por cada milímetro de lluvia sobre un metro cuadrado de techo?",
    "¿En qué año fue introducida Rodolia cardinalis a California?",
    "What stocking density does the FAO guide recommend for aquaponic fish?",
    "¿Qué profundidad de caja basta para el método Square Foot Gardening?",
    "How wide are the standardized permanent beds in market gardening?",
    "¿Qué altura puede alcanzar un avellano europeo de la variedad Barcelona?",
    "¿Cuál es el precio de exportación de la avellana chilena a China?",
    "What nitrogen dose does INIA recommend for quinoa in Los Lagos?"
  ];

  const q = document.getElementById('q'), ask = document.getElementById('ask'), answer = document.getElementById('answer');
  const chips = document.getElementById('chips'), counter = document.getElementById('counter'), themeBtn = document.getElementById('themeBtn');
  const ABSTAIN = 'no encuentro la respuesta en el contexto disponible';
  let lastQuestion = '', statsData = null;

  /* ---------- theme ---------- */
  const THEME_KEY = 'agroteca-theme';
  const systemDark = () => matchMedia('(prefers-color-scheme: dark)').matches;
  function currentIsDark() { const t = document.documentElement.getAttribute('data-theme'); return t === 'dark' || (!t && systemDark()); }
  function applyTheme(theme) { if (theme) document.documentElement.setAttribute('data-theme', theme); else document.documentElement.removeAttribute('data-theme'); themeBtn.textContent = currentIsDark() ? '☀' : '☾'; }
  applyTheme(localStorage.getItem(THEME_KEY));
  themeBtn.onclick = () => { const next = currentIsDark() ? 'light' : 'dark'; localStorage.setItem(THEME_KEY, next); applyTheme(next); };

  /* ---------- language ---------- */
  let currentLang = (navigator.language || 'es').toLowerCase().startsWith('es') ? 'es' : 'en';
  function buildChips(list) {
    chips.innerHTML = '';
    list.forEach(text => {
      const c = document.createElement('span');
      c.className = 'chip'; c.setAttribute('role', 'button'); c.tabIndex = 0;
      c.textContent = text.length > 58 ? text.slice(0, 55) + '…' : text; c.title = text;
      const pick = () => { q.value = text; onInput(); q.focus(); };
      c.onclick = pick;
      c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
      chips.appendChild(c);
    });
  }
  function renderStats() {
    const el = document.getElementById('statsRibbon');
    if (!el || !statsData) return;
    const L = I18N[currentLang].stats;
    el.textContent = statsData.chunks.toLocaleString() + ' ' + L[0] + ' · ' + statsData.documents + ' ' + L[1] + ' · ' + statsData.tiers + ' ' + L[2] + ' · ES/EN';
  }
  function setLang(lang) {
    const t = I18N[lang];
    currentLang = lang; document.documentElement.lang = lang;
    document.getElementById('tagline').innerHTML = t.tagline;
    ask.textContent = t.ask;
    document.getElementById('hint').textContent = t.hint;
    document.getElementById('footer').textContent = t.footer;
    document.getElementById('histTitle').textContent = t.historyTitle;
    document.getElementById('helpTitle').textContent = t.helpTitle;
    buildChips(t.chips);
    document.querySelectorAll('.langtoggle button').forEach(b => { const on = b.dataset.lang === lang; b.classList.toggle('active', on); b.setAttribute('aria-pressed', on); });
    phIdx = 0; q.setAttribute('placeholder', t.chips[0]);
    renderStats();
  }
  document.querySelectorAll('.langtoggle button').forEach(b => b.onclick = () => setLang(b.dataset.lang));

  /* ---------- textarea + rotating placeholder ---------- */
  function onInput() { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 220) + 'px'; counter.textContent = q.value.length ? q.value.length : ''; }
  q.addEventListener('input', onInput);
  let phIdx = 0, phTimer = setInterval(() => { if (document.activeElement === q || q.value) return; const list = I18N[currentLang].chips; phIdx = (phIdx + 1) % list.length; q.setAttribute('placeholder', list[phIdx]); }, 3600);
  setLang(currentLang);

  /* ---------- evidence helpers ---------- */
  function esc(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
  function hasCitation(t) { return /\([^)]{4,}\)/.test(t); }
  function fmtMs(ms) { if (ms < 1000) return ms + 'ms'; const s = ms / 1000; if (s < 90) return s.toFixed(0) + 's'; const m = Math.floor(s / 60), r = Math.round(s % 60); return m + 'm' + (r ? ' ' + r + 's' : ''); }
  function scorePct(s) { return Math.round(Math.max(0, Math.min(1, (s + 1) / 1.6)) * 100); }
  function tierBadge(tier) { const map = { open: ['tier-open', 'open'], synthetic: ['tier-syn', 'synthetic'], local: ['tier-local', 'local'], distractor: ['tier-dist', 'distractor'] }; const e = map[tier] || ['tier-unk', tier || '?']; return '<span class="tier ' + e[0] + '">' + esc(e[1]) + '</span>'; }
  function renderSources(meta) {
    if (!meta || !meta.sources || !meta.sources.length) return '';
    const t = I18N[currentLang];
    const low = meta.sources[0].score < 0 ? '<div class="lowconf">⚠ ' + t.lowConfidence + '</div>' : '';
    const rows = meta.sources.map(s =>
      '<div class="src"><div class="src-head">' + tierBadge(s.tier) + '<span class="src-name">' + esc(s.source) + (s.page ? ' <span class="src-page">· p. ' + s.page + '</span>' : '') + '</span><span class="src-score">' + s.score.toFixed(2) + '</span></div>'
      + '<div class="scorebar"><span style="width:' + scorePct(s.score) + '%"></span></div><div class="src-snip">' + esc(s.snippet) + '…</div></div>'
    ).join('');
    return '<details class="sources"><summary>' + t.sourcesLabel + ' · ' + meta.sources.length + ' · <span class="latency">' + fmtMs(meta.retrieval_ms) + '</span></summary>' + low + rows + '</details>';
  }

  function finalize(text, meta, doneMsg) {
    const t = I18N[currentLang];
    const main = answer.querySelector('.answer-main');
    if (text.toLowerCase().includes(ABSTAIN)) {
      main.innerHTML = '<div class="empty"><div class="empty-icon" aria-hidden="true">🧺</div><div class="empty-title">' + t.abstainTitle + '</div><div class="empty-text">' + t.abstainText + '</div></div>';
    } else {
      const bar = document.createElement('div');
      bar.className = 'actionbar';
      bar.innerHTML = (hasCitation(text) ? '<span class="seal">🌿 ' + t.grounded + '</span>' : '')
        + '<span class="modelbadge">qwen2.5:3b · local</span><span class="spacer"></span>'
        + '<button class="act" data-a="copy">📋 ' + t.copy + '</button>'
        + '<button class="act" data-a="share">🔗 ' + t.share + '</button>'
        + '<button class="act" data-a="export">⬇ ' + t.exportLabel + '</button>'
        + '<button class="act" data-a="up" aria-label="good">👍</button><button class="act" data-a="down" aria-label="bad">👎</button>';
      main.appendChild(bar);
      bar.querySelector('[data-a=copy]').onclick = (e) => { navigator.clipboard.writeText(text); const b = e.currentTarget; b.textContent = '✓ ' + t.copied; setTimeout(() => { b.textContent = '📋 ' + t.copy; }, 1600); };
      bar.querySelector('[data-a=share]').onclick = (e) => { navigator.clipboard.writeText(location.origin + '/?q=' + encodeURIComponent(lastQuestion)); const b = e.currentTarget; b.textContent = '✓ ' + t.shareCopied; setTimeout(() => { b.textContent = '🔗 ' + t.share; }, 1600); };
      bar.querySelector('[data-a=export]').onclick = () => { const md = '# ' + lastQuestion + '\n\n' + text + '\n'; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([md], { type: 'text/markdown' })); a.download = 'agroteca-answer.md'; a.click(); URL.revokeObjectURL(a.href); };
      const up = bar.querySelector('[data-a=up]'), down = bar.querySelector('[data-a=down]');
      const vote = v => {
        up.classList.toggle('on', v === 'up'); down.classList.toggle('on', v === 'down');
        fetch('/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: lastQuestion, vote: v, answer_preview: text.slice(0, 200) }) }).catch(() => {});
      };
      up.onclick = () => vote('up'); down.onclick = () => vote('down');
    }
    if (meta && doneMsg) { const lat = answer.querySelector('.latency'); if (lat) lat.textContent = fmtMs(meta.retrieval_ms) + ' + ' + fmtMs(doneMsg.generation_ms); }
  }

  /* ---------- history ---------- */
  const HKEY = 'agroteca-history';
  function loadHistory() { try { return JSON.parse(localStorage.getItem(HKEY) || '[]'); } catch (_) { return []; } }
  function saveHistory(question) { let h = loadHistory().filter(x => x.q !== question); h.unshift({ q: question, ts: Date.now() }); localStorage.setItem(HKEY, JSON.stringify(h.slice(0, 20))); }
  function renderHistory() {
    const list = document.getElementById('histList'), h = loadHistory();
    if (!h.length) { list.innerHTML = '<div class="hist-empty">' + I18N[currentLang].historyEmpty + '</div>'; return; }
    list.innerHTML = h.map(x => '<button class="hist-item" data-q="' + encodeURIComponent(x.q) + '">' + esc(x.q) + '</button>').join('');
    list.querySelectorAll('.hist-item').forEach(b => b.onclick = () => { q.value = decodeURIComponent(b.dataset.q); onInput(); closeHistory(); run(); });
  }
  function openHistory() { renderHistory(); document.getElementById('histPanel').classList.add('open'); document.getElementById('scrim').classList.add('show'); }
  function closeHistory() { document.getElementById('histPanel').classList.remove('open'); document.getElementById('scrim').classList.remove('show'); }
  document.getElementById('histBtn').onclick = openHistory;
  document.getElementById('histClose').onclick = closeHistory;
  document.getElementById('scrim').onclick = closeHistory;

  /* ---------- help modal ---------- */
  function renderHelp() { document.getElementById('kbds').innerHTML = I18N[currentLang].kbds.map(r => '<div class="kbd-row"><kbd>' + esc(r[0]) + '</kbd><span>' + esc(r[1]) + '</span></div>').join(''); }
  function openHelp() { renderHelp(); document.getElementById('help').classList.add('open'); }
  function closeHelp() { document.getElementById('help').classList.remove('open'); }
  document.getElementById('helpClose').onclick = closeHelp;
  document.getElementById('help').onclick = (e) => { if (e.target.id === 'help') closeHelp(); };

  /* ---------- keyboard shortcuts ---------- */
  document.addEventListener('keydown', e => {
    const typing = document.activeElement === q;
    if (e.key === '/' && !typing) { e.preventDefault(); q.focus(); }
    else if (e.key === '?' && !typing) { e.preventDefault(); openHelp(); }
    else if (e.key === 'Escape') {
      if (document.getElementById('histPanel').classList.contains('open')) closeHistory();
      else if (document.getElementById('help').classList.contains('open')) closeHelp();
      else if (typing) { q.value = ''; onInput(); }
    }
  });

  /* ---------- surprise-me ---------- */
  document.getElementById('surprise').onclick = () => { q.value = SURPRISE[Math.floor(Math.random() * SURPRISE.length)]; onInput(); run(); };

  /* ---------- health + stats + shared link ---------- */
  function pollHealth() { fetch('/health').then(r => r.ok).catch(() => false).then(ok => { const d = document.getElementById('healthdot'); if (d) d.className = 'dot ' + (ok ? 'ok' : 'down'); }); }
  pollHealth(); setInterval(pollHealth, 20000);
  fetch('/stats').then(r => r.json()).then(s => { statsData = s; renderStats(); }).catch(() => {});

  /* ---------- the life-cycle reel ---------- */
  const SPROUT = ['🌰', '🌱', '🌿', '🌸', '🍎'];
  let sproutTimer = null, abortCtrl = null, elapsedTimer = null;
  function stopSprout() { if (sproutTimer) { clearInterval(sproutTimer); sproutTimer = null; } }

  async function run() {
    const question = q.value.trim();
    if (!question) return;
    lastQuestion = question;
    history.replaceState(null, '', '?q=' + encodeURIComponent(question));
    ask.disabled = true;
    abortCtrl = new AbortController();
    const startT = Date.now();

    answer.className = 'answer show';
    answer.innerHTML = '<div class="loading"><div class="sprout" aria-hidden="true">🌰</div>'
      + '<div class="loading-text">' + I18N[currentLang].loading + ' <span id="elapsed">0s</span></div>'
      + '<button class="stopbtn" id="stop"></button></div>';
    answer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    { const s = document.getElementById('stop'); s.textContent = I18N[currentLang].stopLabel; s.onclick = () => abortCtrl.abort(); }

    const sproutEl = answer.querySelector('.sprout');
    let frame = 0; stopSprout();
    sproutTimer = setInterval(() => { frame = (frame + 1) % SPROUT.length; sproutEl.textContent = SPROUT[frame]; }, 1100);
    clearInterval(elapsedTimer);
    elapsedTimer = setInterval(() => { const el = document.getElementById('elapsed'); if (el) el.textContent = ((Date.now() - startT) / 1000).toFixed(0) + 's'; }, 500);

    let firstT = 0, tokCount = 0;
    try {
      const resp = await fetch('/ask/stream', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question }), signal: abortCtrl.signal });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '', streamEl = null, meta = null, statTextEl = null;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
          if (!line) continue;
          let msg; try { msg = JSON.parse(line); } catch (_) { continue; }
          if (msg.type === 'meta') {
            meta = msg;
          } else if (msg.type === 'token') {
            if (!streamEl) {
              stopSprout(); firstT = Date.now();
              answer.innerHTML = '<div class="streamstats" id="stats"><span id="statstext"></span><button class="stopbtn" id="stop2"></button></div>'
                + '<div class="answer-main"><span class="answer-text" id="stream"></span><span class="cursor"></span></div>' + renderSources(meta);
              streamEl = document.getElementById('stream'); statTextEl = document.getElementById('statstext');
              const s2 = document.getElementById('stop2'); s2.textContent = I18N[currentLang].stopLabel; s2.onclick = () => abortCtrl.abort();
            }
            tokCount++;
            streamEl.insertAdjacentHTML('beforeend', '<span class="tok">' + esc(msg.text) + '</span>');
            const secs = (Date.now() - firstT) / 1000;
            statTextEl.textContent = '🌿 ' + tokCount + ' tok · ' + (secs > 0 ? (tokCount / secs).toFixed(1) : '0.0') + ' tok/s';
          } else if (msg.type === 'done') {
            const cur = answer.querySelector('.cursor'); if (cur) cur.remove();
            const st = document.getElementById('stats'); if (st) st.remove();
            if (streamEl) finalize(streamEl.textContent, meta, msg);
            saveHistory(lastQuestion);
          }
        }
      }
    } catch (e) {
      const st = document.getElementById('stats'); if (st) st.remove();
      const cur = answer.querySelector('.cursor'); if (cur) cur.remove();
      if (e.name === 'AbortError') {
        const main = answer.querySelector('.answer-main');
        const note = '<div class="stopped">■ ' + I18N[currentLang].stopped + '</div>';
        if (main) main.insertAdjacentHTML('beforeend', note); else answer.innerHTML = note;
      } else { answer.textContent = I18N[currentLang].error(e.message); }
    } finally {
      stopSprout(); clearInterval(elapsedTimer); ask.disabled = false; abortCtrl = null;
    }
  }

  ask.onclick = run;
  q.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); } });

  /* ---------- shared ?q= link: prefill and auto-ask ---------- */
  (function () {
    const shared = new URLSearchParams(location.search).get('q');
    if (shared) { q.value = shared; onInput(); run(); }
  })();
</script>
</body>
</html>
