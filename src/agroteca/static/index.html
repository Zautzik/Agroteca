<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agroteca — asistente agronómico</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌱%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4eede; --card: #fffdf8; --ink: #2c2a26; --muted: #837c6c;
    --green: #3f5b2e; --green-deep: #2c401f; --accent: #c47f3f; --line: #e7ddc9;
    --field: #ffffff; --chip-bg: #edf1e4; --chip-border: #dde5cf; --toggle-border: #d3ddc2;
    --shadow: 0 14px 40px rgba(52, 42, 20, 0.10); --glow: rgba(63,91,46,.13);
  }
  :root[data-theme="dark"] {
    --bg: #161b12; --card: #1f2618; --ink: #e9e5d7; --muted: #9c9784;
    --green: #8bbb5d; --green-deep: #b0d585; --accent: #e0a95a; --line: #333c28;
    --field: #191f14; --chip-bg: rgba(139,187,93,.13); --chip-border: #3a4530; --toggle-border: #3a4530;
    --shadow: 0 16px 44px rgba(0, 0, 0, 0.45); --glow: rgba(139,187,93,.22);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161b12; --card: #1f2618; --ink: #e9e5d7; --muted: #9c9784;
      --green: #8bbb5d; --green-deep: #b0d585; --accent: #e0a95a; --line: #333c28;
      --field: #191f14; --chip-bg: rgba(139,187,93,.13); --chip-border: #3a4530; --toggle-border: #3a4530;
      --shadow: 0 16px 44px rgba(0, 0, 0, 0.45); --glow: rgba(139,187,93,.22);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: radial-gradient(1100px 480px at 50% -12%, rgba(90, 120, 60, 0.13), transparent), var(--bg);
    min-height: 100vh; line-height: 1.6; -webkit-font-smoothing: antialiased;
    transition: background-color .3s, color .3s;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 52px 20px 90px; }
  :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; border-radius: 8px; }

  .controls { position: fixed; top: 20px; right: 20px; z-index: 20; display: flex; align-items: center; gap: 10px; }
  .iconbtn {
    width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--toggle-border);
    background: var(--card); color: var(--ink); font-size: 20px; cursor: pointer;
    box-shadow: var(--shadow); transition: transform .15s, border-color .15s;
  }
  .iconbtn:hover { transform: translateY(-1px) rotate(-8deg); border-color: var(--green); }
  .langtoggle {
    display: inline-flex; align-items: center; gap: 2px;
    background: var(--card); border: 2px solid var(--toggle-border); border-radius: 999px;
    padding: 6px; box-shadow: var(--shadow);
  }
  .langtoggle .leaf { font-size: 20px; padding: 0 4px 0 9px; }
  .langtoggle button {
    background: transparent; color: var(--muted); border: 0; border-radius: 999px;
    padding: 9px 16px; font-size: 15px; font-weight: 800; cursor: pointer; letter-spacing: .5px;
    transition: background .18s, color .18s;
  }
  .langtoggle button.active { background: var(--green); color: #fff; box-shadow: 0 3px 10px var(--glow); }
  .langtoggle button:not(.active):hover { color: var(--green-deep); }

  header { text-align: center; margin-bottom: 32px; animation: rise .5s ease both; }
  .logo { font-size: 44px; line-height: 1; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 600; font-size: 36px; margin: 8px 0 6px; color: var(--green-deep); letter-spacing: -0.5px; }
  .tag { color: var(--muted); font-size: 15px; margin: 0; }
  .tag em { color: var(--accent); font-style: italic; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 22px; animation: rise .5s ease .06s both; }
  textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 13px; padding: 14px 16px;
    font-size: 16px; font-family: inherit; color: var(--ink); resize: none; overflow: hidden;
    min-height: 74px; background: var(--field); outline: none; transition: border-color .15s, box-shadow .15s;
  }
  textarea:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--glow); }
  .row { display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  button.ask { background: var(--green); color: #fff; border: 0; border-radius: 12px; padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s, transform .05s, box-shadow .15s; }
  button.ask:hover { background: var(--green-deep); box-shadow: 0 6px 16px var(--glow); }
  button.ask:active { transform: translateY(1px); }
  button.ask:disabled { background: var(--muted); cursor: not-allowed; box-shadow: none; opacity: .65; }
  .hint { color: var(--muted); font-size: 13px; }
  .counter { color: var(--muted); font-size: 12px; margin-left: auto; opacity: .7; font-variant-numeric: tabular-nums; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chip { font-size: 13px; color: var(--green-deep); background: var(--chip-bg); border: 1px solid var(--chip-border); border-radius: 999px; padding: 6px 13px; cursor: pointer; transition: transform .15s, background .15s, box-shadow .15s; }
  .chip:hover { transform: translateY(-2px); box-shadow: 0 4px 12px var(--glow); }

  .answer { margin-top: 22px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--green); border-radius: 13px; padding: 20px 22px; font-size: 16.5px; display: none; }
  .answer.show { display: block; animation: rise .35s ease both; }
  .answer-text { white-space: pre-wrap; word-wrap: break-word; }
  .cursor { display: inline-block; width: 8px; height: 1.05em; vertical-align: text-bottom; background: var(--accent); margin-left: 1px; animation: blink 1s steps(1) infinite; }
  .tok { animation: fadeIn .5s ease both; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* answer action bar (Wave B) */
  .actionbar { display: flex; align-items: center; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .seal { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--green-deep); background: var(--chip-bg); border: 1px solid var(--chip-border); border-radius: 999px; padding: 5px 11px; }
  .modelbadge { font-size: 11.5px; color: var(--muted); letter-spacing: .3px; }
  .spacer { margin-left: auto; }
  .act { display: inline-flex; align-items: center; gap: 5px; background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 9px; padding: 6px 11px; font-size: 13px; cursor: pointer; transition: color .15s, border-color .15s, background .15s; font-family: inherit; }
  .act:hover { color: var(--green-deep); border-color: var(--green); }
  .act.on { color: var(--green); border-color: var(--green); background: var(--chip-bg); }

  /* abstention "empty basket" state */
  .empty { text-align: center; padding: 12px 0 6px; }
  .empty-icon { font-size: 46px; }
  .empty-title { font-weight: 700; color: var(--green-deep); margin-top: 8px; }
  .empty-text { color: var(--muted); font-size: 14px; margin-top: 4px; max-width: 44ch; margin-left: auto; margin-right: auto; }

  /* the life-cycle reel */
  .loading { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 0 8px; }
  .sprout { font-size: 48px; line-height: 1; display: inline-block; animation: sproutPop 1.1s ease-in-out infinite; }
  @keyframes sproutPop { 0% { transform: scale(.55) translateY(6px); opacity: .5; } 38% { transform: scale(1.2) translateY(-2px); } 100% { transform: scale(1) translateY(0); opacity: 1; } }
  .loading-text { color: var(--muted); font-style: italic; font-size: 14.5px; }

  footer { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 34px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
  <div class="controls">
    <button class="iconbtn" id="themeBtn" aria-label="Cambiar tema / Toggle theme" title="Tema">☾</button>
    <div class="langtoggle" id="langtoggle" role="group" aria-label="Idioma / Language">
      <span class="leaf" aria-hidden="true">🌿</span>
      <button data-lang="es" aria-pressed="false">ES</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <div class="wrap">
    <header>
      <div class="logo" aria-hidden="true">🌱</div>
      <h1>Agroteca</h1>
      <p class="tag" id="tagline"></p>
    </header>

    <div class="card">
      <textarea id="q" rows="1" aria-label="Pregunta / Question"></textarea>
      <div class="row">
        <button class="ask" id="ask"></button>
        <span class="hint" id="hint"></span>
        <span class="counter" id="counter" aria-hidden="true"></span>
      </div>
      <div class="chips" id="chips"></div>
    </div>

    <div class="answer" id="answer" aria-live="polite" role="status"></div>

    <footer id="footer"></footer>
  </div>

<script>
  const I18N = {
    es: {
      tagline: 'Respuestas agronómicas <em>con cita</em> — o un honesto "no lo sé".',
      ask: 'Preguntar',
      hint: 'Ctrl+Enter para enviar · la 1ª respuesta tarda ~1–2 min (modelo local en CPU)',
      loading: 'Consultando el corpus…',
      footer: 'Local · sin nube · fundado en un corpus curado y gobernado por licencia.',
      error: (m) => 'Error: ' + m + ' — ¿está corriendo el servidor (uvicorn)?',
      grounded: 'Fundado', copy: 'Copiar', copied: 'Copiado', exportLabel: 'Exportar',
      abstainTitle: 'Fuera del corpus',
      abstainText: 'No está en las fuentes disponibles — y el sistema prefiere decirlo a inventarlo.',
      chips: [
        "¿Cuánta agua se puede captar por cada milímetro de lluvia sobre un metro cuadrado de techo?",
        "¿En qué año fue introducida Rodolia cardinalis a California?",
        "What stocking density does the FAO guide recommend for aquaponic fish?",
        "¿Cuál es el precio de exportación de la avellana chilena a China?"
      ]
    },
    en: {
      tagline: 'Agronomy answers <em>with citations</em> — or an honest "I don\'t know".',
      ask: 'Ask',
      hint: 'Ctrl+Enter to send · the first answer takes ~1–2 min (local model on CPU)',
      loading: 'Searching the corpus…',
      footer: 'Local · no cloud · grounded in a curated, license-governed corpus.',
      error: (m) => 'Error: ' + m + ' — is the server (uvicorn) running?',
      grounded: 'Grounded', copy: 'Copy', copied: 'Copied', exportLabel: 'Export',
      abstainTitle: 'Outside the corpus',
      abstainText: 'It\'s not in the available sources — and the system would rather say so than invent it.',
      chips: [
        "How much water can be harvested per millimetre of rain on a square metre of roof?",
        "In what year was Rodolia cardinalis introduced to California?",
        "¿Qué densidad de peces recomienda la guía FAO para un sistema acuapónico?",
        "What is the export price of Chilean hazelnuts to China?"
      ]
    }
  };

  const q = document.getElementById('q');
  const ask = document.getElementById('ask');
  const answer = document.getElementById('answer');
  const chips = document.getElementById('chips');
  const counter = document.getElementById('counter');
  const themeBtn = document.getElementById('themeBtn');
  const ABSTAIN = 'no encuentro la respuesta en el contexto disponible';
  let lastQuestion = '';

  /* ---------- theme ---------- */
  const THEME_KEY = 'agroteca-theme';
  const systemDark = () => matchMedia('(prefers-color-scheme: dark)').matches;
  function currentIsDark() { const t = document.documentElement.getAttribute('data-theme'); return t === 'dark' || (!t && systemDark()); }
  function applyTheme(theme) {
    if (theme) document.documentElement.setAttribute('data-theme', theme);
    else document.documentElement.removeAttribute('data-theme');
    themeBtn.textContent = currentIsDark() ? '☀' : '☾';
  }
  applyTheme(localStorage.getItem(THEME_KEY));
  themeBtn.onclick = () => { const next = currentIsDark() ? 'light' : 'dark'; localStorage.setItem(THEME_KEY, next); applyTheme(next); };

  /* ---------- language / i18n ---------- */
  let currentLang = (navigator.language || 'es').toLowerCase().startsWith('es') ? 'es' : 'en';
  function buildChips(list) {
    chips.innerHTML = '';
    list.forEach(text => {
      const c = document.createElement('span');
      c.className = 'chip'; c.setAttribute('role', 'button'); c.tabIndex = 0;
      c.textContent = text.length > 58 ? text.slice(0, 55) + '…' : text;
      c.title = text;
      const pick = () => { q.value = text; onInput(); q.focus(); };
      c.onclick = pick;
      c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
      chips.appendChild(c);
    });
  }
  function setLang(lang) {
    const t = I18N[lang];
    currentLang = lang;
    document.documentElement.lang = lang;
    document.getElementById('tagline').innerHTML = t.tagline;
    ask.textContent = t.ask;
    document.getElementById('hint').textContent = t.hint;
    document.getElementById('footer').textContent = t.footer;
    buildChips(t.chips);
    document.querySelectorAll('.langtoggle button').forEach(b => {
      const on = b.dataset.lang === lang; b.classList.toggle('active', on); b.setAttribute('aria-pressed', on);
    });
    phIdx = 0; q.setAttribute('placeholder', t.chips[0]);
  }
  document.querySelectorAll('.langtoggle button').forEach(b => b.onclick = () => setLang(b.dataset.lang));

  /* ---------- textarea auto-resize + counter ---------- */
  function onInput() { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 220) + 'px'; counter.textContent = q.value.length ? q.value.length : ''; }
  q.addEventListener('input', onInput);

  /* ---------- rotating placeholder ---------- */
  let phIdx = 0, phTimer = setInterval(() => {
    if (document.activeElement === q || q.value) return;
    const list = I18N[currentLang].chips; phIdx = (phIdx + 1) % list.length; q.setAttribute('placeholder', list[phIdx]);
  }, 3600);

  setLang(currentLang);

  /* ---------- answer helpers (Wave B) ---------- */
  function esc(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
  function hasCitation(t) { return /\([^)]{4,}\)/.test(t); }

  function finalize(text) {
    const t = I18N[currentLang];
    if (text.toLowerCase().includes(ABSTAIN)) {
      answer.innerHTML = '<div class="empty"><div class="empty-icon" aria-hidden="true">🧺</div>'
        + '<div class="empty-title">' + t.abstainTitle + '</div>'
        + '<div class="empty-text">' + t.abstainText + '</div></div>';
      return;
    }
    const bar = document.createElement('div');
    bar.className = 'actionbar';
    bar.innerHTML = (hasCitation(text) ? '<span class="seal">🌿 ' + t.grounded + '</span>' : '')
      + '<span class="modelbadge">qwen2.5:3b · local</span>'
      + '<span class="spacer"></span>'
      + '<button class="act" data-a="copy">📋 ' + t.copy + '</button>'
      + '<button class="act" data-a="export">⬇ ' + t.exportLabel + '</button>'
      + '<button class="act" data-a="up" aria-label="good">👍</button>'
      + '<button class="act" data-a="down" aria-label="bad">👎</button>';
    answer.appendChild(bar);

    bar.querySelector('[data-a=copy]').onclick = (e) => {
      navigator.clipboard.writeText(text);
      const b = e.currentTarget; b.textContent = '✓ ' + t.copied;
      setTimeout(() => { b.textContent = '📋 ' + t.copy; }, 1600);
    };
    bar.querySelector('[data-a=export]').onclick = () => {
      const md = '# ' + lastQuestion + '\n\n' + text + '\n';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([md], { type: 'text/markdown' }));
      a.download = 'agroteca-answer.md'; a.click(); URL.revokeObjectURL(a.href);
    };
    const up = bar.querySelector('[data-a=up]'), down = bar.querySelector('[data-a=down]');
    function vote(v) {
      up.classList.toggle('on', v === 'up'); down.classList.toggle('on', v === 'down');
      try { localStorage.setItem('agroteca-fb-' + btoa(unescape(encodeURIComponent(lastQuestion))).slice(0, 28), v); } catch (_) {}
    }
    up.onclick = () => vote('up'); down.onclick = () => vote('down');
  }

  /* ---------- the life-cycle reel ---------- */
  const SPROUT = ['🌰', '🌱', '🌿', '🌸', '🍎'];
  let sproutTimer = null;
  function stopSprout() { if (sproutTimer) { clearInterval(sproutTimer); sproutTimer = null; } }

  async function run() {
    const question = q.value.trim();
    if (!question) return;
    lastQuestion = question;
    ask.disabled = true;
    answer.className = 'answer show';
    answer.innerHTML = '<div class="loading"><div class="sprout" aria-hidden="true">🌰</div><div class="loading-text">'
                       + I18N[currentLang].loading + '</div></div>';
    answer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    const sproutEl = answer.querySelector('.sprout');
    let frame = 0;
    stopSprout();
    sproutTimer = setInterval(() => { frame = (frame + 1) % SPROUT.length; sproutEl.textContent = SPROUT[frame]; }, 1100);

    try {
      const resp = await fetch('/ask/stream', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question })
      });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let streamEl = null;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = decoder.decode(value, { stream: true });
        if (!streamEl) {
          stopSprout();
          answer.innerHTML = '<span class="answer-text" id="stream"></span><span class="cursor"></span>';
          streamEl = document.getElementById('stream');
        }
        streamEl.insertAdjacentHTML('beforeend', '<span class="tok">' + esc(chunk) + '</span>');
      }
      const cur = answer.querySelector('.cursor');
      if (cur) cur.remove();
      if (streamEl) finalize(streamEl.textContent);
    } catch (e) {
      stopSprout();
      answer.textContent = I18N[currentLang].error(e.message);
    } finally {
      stopSprout();
      ask.disabled = false;
    }
  }

  ask.onclick = run;
  q.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); } });
</script>
</body>
</html>
