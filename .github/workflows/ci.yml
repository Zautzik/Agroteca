name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Install dependencies (exactly as locked)
        run: uv sync --locked --all-groups
      - name: Validate golden set
        run: uv run --locked python eval/validate_golden.py
      - name: Unit tests
        run: >
          uv run --locked pytest -q
          --deselect tests/test_scoring.py::test_reranker_scores_a_relevant_chunk_higher_than_an_irrelevant_one
