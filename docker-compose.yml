services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agroteca-pgvector
    environment:
      POSTGRES_PASSWORD: agroteca
      POSTGRES_DB: agroteca
    ports:
      - "5433:5432"   # host 5433 -> container 5432 (5432 is taken by another Postgres)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agroteca"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: {}
